name = "OpenCode Go"
env = ["OPENCODE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Protocol-specific Go inference bases (accessed 2026-10-15): the `/inference/go/...`
# equivalents of the standard bases, billed against the Go subscription.
# `/inference/go/openai/v1` serves chat completions and responses; Anthropic and
# Gemini models override `provider.api`. Requests require `x-opencode-session`.
# https://opencode.ai/v2/docs/console/go/
api = "https://opencode.ai/inference/go/openai/v1"
doc = "https://opencode.ai/v2/docs/console/go/"
